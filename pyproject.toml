[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "perovskite-active-learning"
version = "0.1.0"
description = "Closed-loop active learning and Bayesian optimization for perovskite bandgap engineering"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Your Name" }]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "pymatgen>=2024.1.1",
    "ase>=3.22",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "matplotlib>=3.8",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]
live = [
    "mp-api>=0.41",
]

[tool.setuptools.packages.find]
include = ["perov_core*", "surrogate*", "dft_runner*", "pipeline*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
